[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "todo-tracker"
version = "0.1.0"
description = "Menu bar notes tracker for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rumps>=0.4.0,<0.5.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "typer>=0.16.0,<0.17.0",
]

[dependency-groups]
dev = [
  "py2app>=0.28.10",
  "pytest>=8.0.0,<9.0.0",
]

[project.scripts]
todo-tracker = "todo_tracker.cli:app"
todo-tracker-menubar = "todo_tracker.menubar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_tracker"]
